<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plant Sickness Local Processing</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="card">
    <h2>Plant Sickness Detection</h2>

    <div class="action-buttons">
      <!-- File Upload Label -->
      <label for="fileInput" class="btn btn-secondary" id="fileLabel">
        Choose Image File
      </label>
      <input type="file" id="fileInput" accept="image/*">

      <!-- Camera Capture Label -->
      <label for="cameraInput" class="btn btn-secondary">
        📷 Take Picture
      </label>
      <input type="file" id="cameraInput" accept="image/*" capture="environment">
    </div>

    <button id="processBtn" class="btn btn-primary" style="display: none;">Process Image (WASM)</button>

    <div class="preview-container">
      <canvas id="canvasPreview" width="224" height="224" style="display:none;"></canvas>
    </div>

    <div id="status" class="status-box">Select an image or take a photo to start.</div>
  </div>

  <script type="module">
    import init, { process_image_full } from './pkg/plant_sickness.js';

    async function run() {
      await init();

      const fileInput = document.getElementById('fileInput');
      const cameraInput = document.getElementById('cameraInput');
      const fileLabel = document.getElementById('fileLabel');
      const processBtn = document.getElementById('processBtn');
      const canvas = document.getElementById('canvasPreview');
      const ctx = canvas.getContext('2d');
      const status = document.getElementById('status');

      let selectedByteArray = null;

      async function handleFileSelect(file) {
        canvas.style.display = 'none';

        if (file) {
          fileLabel.innerText = file.name;
          const buffer = await file.arrayBuffer();
          selectedByteArray = new Uint8Array(buffer);
          processBtn.style.display = 'block';
          status.innerText = 'Image loaded! Ready to process in WASM.';
        }
      }

      fileInput.addEventListener('change', (e) => {
        handleFileSelect(e.target.files[0]);
      });

      cameraInput.addEventListener('change', (e) => {
        handleFileSelect(e.target.files[0]);
      });

      processBtn.addEventListener('click', () => {
        if (!selectedByteArray) return;

        status.innerText = 'Executing pipeline (Decoding -> EXIF -> Scaling -> Segmentation -> Normalization)...';
        processBtn.disabled = true;

        try {
          // Pass image bytes into Rust pipeline
          const result = process_image_full(selectedByteArray);

          // 1. Extract RGBA bytes to draw on HTML5 Canvas
          const rgbaBytes = result.rgba_bytes;
          const imageData = new ImageData(
            new Uint8ClampedArray(rgbaBytes.buffer),
            224,
            224
          );
          ctx.putImageData(imageData, 0, 0);
          canvas.style.display = 'block';

          // 2. Extract Normalized RGB Float Tensor
          const normalizedTensor = result.normalized_tensor;

          status.innerText = `Processing complete! Canvas updated. Normalized Tensor Size: ${normalizedTensor.length} floats.`;
        } catch (err) {
          status.innerText = 'Error processing image: ' + err;
          console.error(err);
        } finally {
          processBtn.disabled = false;
        }
      });
    }

    run();
  </script>
</body>
</html>
