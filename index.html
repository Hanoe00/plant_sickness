<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plant Sickness Detection</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="card">
    <h2>Plant Sickness Detection</h2>

    <div class="action-buttons">
      <!-- File Upload Label -->
      <label for="fileInput" class="btn btn-secondary" id="fileLabel">
        Choose Image File
      </label>
      <!-- Restrict accept types to prevent HEIC format crashes on iOS -->
      <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp">

      <!-- Camera Capture Label -->
      <label for="cameraInput" class="btn btn-secondary" id="cameraLabel">
        Take Picture
      </label>
      <input type="file" id="cameraInput" accept="image/jpeg,image/png" capture="environment">
    </div>

    <button id="processBtn" class="btn btn-primary" style="display: none;">Process Image</button>

    <div class="preview-container">
      <canvas id="canvasPreview" width="224" height="224" style="display:none;"></canvas>
    </div>

    <div id="status" class="status-box">Select an image or take a photo to start.</div>
    
    <div id="diagnosis-container"></div>
  </div>

  <script type="module">
    import init, { process_image_full, predict_disease } from './pkg/plant_sickness.js';
    import { DISEASE_LABELS, DIAGNOSIS_DATA } from './diagnosisData.js';

    function softmax(logits) {
      const maxLogit = Math.max(...logits);
      const exps = logits.map(x => Math.exp(x - maxLogit));
      const sumExps = exps.reduce((a, b) => a + b, 0);
      return exps.map(x => x / sumExps);
    }

    function displayDiagnosis(diseaseKey, confidence) {
      const container = document.getElementById("diagnosis-container");
      const numericConfidence = parseFloat(confidence);

      // Low confidence warning (< 50%)
      if (numericConfidence < 50.0) {
        const readableName = diseaseKey ? diseaseKey.replace(/___/g, ' - ') : 'Unknown';
        container.innerHTML = `
          <div class="diagnosis-card unknown">
            <h2>⚠️ Low Confidence Prediction (${confidence}%)</h2>
            <p class="description">
              The model isn't confident enough to make an accurate diagnosis. 
              The top guess was <strong>${readableName}</strong>, but the probability is low.
            </p>
            <h3>Recommendations:</h3>
            <ul>
              <li>Ensure the leaf is clearly visible and centered in the frame.</li>
              <li>Take a photo with better lighting and avoid sharp shadows.</li>
              <li>Try focusing closely on an individual leaf showing visible symptoms.</li>
            </ul>
          </div>
        `;
        return;
      }

      // High confidence prediction (>= 50%)
      const info = DIAGNOSIS_DATA[diseaseKey] || {
        name: "Unknown Condition",
        status: "unknown",
        description: "Unable to classify the specific leaf sickness.",
        symptoms: [],
        treatment: []
      };

      container.innerHTML = `
        <div class="diagnosis-card ${info.status}">
          <h2>${info.name} <span class="confidence">(${confidence}% confidence)</span></h2>
          <p class="description">${info.description}</p>
          
          <h3>Symptoms Detected:</h3>
          <ul>
            ${info.symptoms.map(s => `<li>${s}</li>`).join('')}
          </ul>

          <h3>Recommended Treatment:</h3>
          <ul>
            ${info.treatment.map(t => `<li>${t}</li>`).join('')}
          </ul>
        </div>
      `;
    }

    async function run() {
      // Initialize WASM binary
      await init('./pkg/plant_sickness_bg.wasm');
      
      // Initialize Panic Hook for clear console errors if WASM panics
      //if (typeof init_panic_hook === 'function') {
       // init_panic_hook();
      //}

      const fileInput = document.getElementById('fileInput');
      const cameraInput = document.getElementById('cameraInput');
      const fileLabel = document.getElementById('fileLabel');
      const cameraLabel = document.getElementById('cameraLabel');
      const processBtn = document.getElementById('processBtn');
      const canvas = document.getElementById('canvasPreview');
      const ctx = canvas.getContext('2d');
      const status = document.getElementById('status');

      let selectedByteArray = null;

      async function handleFileSelect(file, isCamera = false) {
        canvas.style.display = 'none';

        if (!file) return;

        // Reset display labels
        if (isCamera) {
          cameraLabel.innerText = "Captured: Photo";
          fileLabel.innerText = "Choose Image File";
        } else {
          fileLabel.innerText = file.name;
          cameraLabel.innerText = "Take Picture";
        }

        try {
          const buffer = await file.arrayBuffer();
          selectedByteArray = new Uint8Array(buffer);
          processBtn.style.display = 'block';
          status.innerText = 'Image loaded! Ready to process.';
        } catch (err) {
          status.innerText = 'Failed to read image file.';
          console.error(err);
        }
      }

      fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
          handleFileSelect(e.target.files[0], false);
        }
      });

      cameraInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
          handleFileSelect(e.target.files[0], true);
        }
      });

      processBtn.addEventListener('click', () => {
        if (!selectedByteArray) return;

        status.innerText = 'Executing pipeline (Decoding -> EXIF -> Scaling -> Segmentation -> Normalization)...';
        processBtn.disabled = true;

        try {
          
          const result = process_image_full(selectedByteArray, null);

          
          const rgbaBytes = result.rgba_bytes;
          const clampedArray = new Uint8ClampedArray(
            rgbaBytes.buffer,
            rgbaBytes.byteOffset,
            rgbaBytes.byteLength
          );

          const imageData = new ImageData(clampedArray, 224, 224);
          ctx.putImageData(imageData, 0, 0);
          canvas.style.display = 'block';

          // Access Tensor array
          const normalizedTensor = result.normalized_tensor;

          // Predict raw logits from WASM
          const logits = predict_disease(normalizedTensor);

          // Find predicted class index (ArgMax)
          const maxLogit = Math.max(...logits);
          const predictedIndex = logits.indexOf(maxLogit);
          const diseaseKey = DISEASE_LABELS[predictedIndex];

          // Convert logits to confidence percentage via Softmax
          const probabilities = softmax(logits);
          const confidence = (probabilities[predictedIndex] * 100).toFixed(1);

          // Render diagnosis result to UI
          displayDiagnosis(diseaseKey, confidence);

          status.innerText = `Processing complete!`;
        } catch (err) {
          status.innerText = 'Error processing image: ' + err;
          console.error(err);
        } finally {
          processBtn.disabled = false;
        }
      });
    }

    run();
  </script>
</body>
</html>
