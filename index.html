<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plant Sickness Detection</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="card">
    <h2>Plant Sickness Detection</h2>

    <div class="action-buttons">
      <!-- File Upload Label -->
      <label for="fileInput" class="btn btn-secondary" id="fileLabel">
        Choose Image File
      </label>
      <!-- Restrict accept types to prevent HEIC format crashes on iOS -->
      <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp">

      <!-- Camera Capture Label -->
      <label for="cameraInput" class="btn btn-secondary" id="cameraLabel">
        Take Picture
      </label>
      <input type="file" id="cameraInput" accept="image/jpeg,image/png" capture="environment">
    </div>

    <button id="processBtn" class="btn btn-primary" style="display: none;">Process Image</button>

    <div class="preview-container">
      <canvas id="canvasPreview" width="224" height="224" style="display:none;"></canvas>
    </div>

    <div id="status" class="status-box">Select an image or take a photo to start.</div>
  </div>

  <script type="module">
    import init, { process_image_full, init_panic_hook } from './pkg/plant_sickness.js';

    async function run() {
      // Initialize WASM binary
      await init('./pkg/plant_sickness_bg.wasm');
      
      // Initialize Panic Hook for clear console errors if WASM panics
      if (typeof init_panic_hook === 'function') {
        init_panic_hook();
      }

      const fileInput = document.getElementById('fileInput');
      const cameraInput = document.getElementById('cameraInput');
      const fileLabel = document.getElementById('fileLabel');
      const cameraLabel = document.getElementById('cameraLabel');
      const processBtn = document.getElementById('processBtn');
      const canvas = document.getElementById('canvasPreview');
      const ctx = canvas.getContext('2d');
      const status = document.getElementById('status');

      let selectedByteArray = null;

      async function handleFileSelect(file, isCamera = false) {
        canvas.style.display = 'none';

        if (!file) return;

        // Reset display labels
        if (isCamera) {
          cameraLabel.innerText = "Captured: Photo";
          fileLabel.innerText = "Choose Image File";
        } else {
          fileLabel.innerText = file.name;
          cameraLabel.innerText = "Take Picture";
        }

        try {
          const buffer = await file.arrayBuffer();
          selectedByteArray = new Uint8Array(buffer);
          processBtn.style.display = 'block';
          status.innerText = 'Image loaded! Ready to process.';
        } catch (err) {
          status.innerText = 'Failed to read image file.';
          console.error(err);
        }
      }

      fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
          handleFileSelect(e.target.files[0], false);
        }
      });

      cameraInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
          handleFileSelect(e.target.files[0], true);
        }
      });

      processBtn.addEventListener('click', () => {
        if (!selectedByteArray) return;

        status.innerText = 'Executing pipeline (Decoding -> EXIF -> Scaling -> Segmentation -> Normalization)...';
        processBtn.disabled = true;

        try {
          // FIX 1: Pass null for the second argument (Option<FilterOptions>)
          const result = process_image_full(selectedByteArray, null);

          // FIX 2: Safely extract WebAssembly Uint8Array memory slice
          const rgbaBytes = result.rgba_bytes;
          const clampedArray = new Uint8ClampedArray(
            rgbaBytes.buffer,
            rgbaBytes.byteOffset,
            rgbaBytes.byteLength
          );

          const imageData = new ImageData(clampedArray, 224, 224);
          ctx.putImageData(imageData, 0, 0);
          canvas.style.display = 'block';

          // Access Tensor array
          const normalizedTensor = result.normalized_tensor;

          status.innerText = `Processing complete! Tensor Size: ${normalizedTensor.length}`;
        } catch (err) {
          status.innerText = 'Error processing image: ' + err;
          console.error(err);
        } finally {
          processBtn.disabled = false;
        }
      });
    }

    run();
  </script>
</body>
</html>
