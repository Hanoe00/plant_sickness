<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rust Wasm Image Upload</title>
</head>
<body>
  <h2>Upload Image via Rust WebAssembly</h2>

  <input type="file" id="fileInput" accept="image/*"><br><br>
  <img id="preview" width="300" style="display:none;" alt="Preview"><br><br>
  <button id="uploadBtn" style="display:none;">Upload to Server</button>

  <p id="status"></p>

  <script type="module">
    import init, { upload_image } from './pkg/plant_sickness.js';

    async function run() {
      await init();

      const fileInput = document.getElementById('fileInput');
      const preview = document.getElementById('preview');
      const uploadBtn = document.getElementById('uploadBtn');
      const status = document.getElementById('status');

      let selectedFile = null;

      // Handle file selection and preview
      fileInput.addEventListener('change', (e) => {
        selectedFile = e.target.files[0];
        if (selectedFile) {
          preview.src = URL.createObjectURL(selectedFile);
          preview.style.display = 'block';
          uploadBtn.style.display = 'inline-block';
        }
      });

      // Handle upload button click
      uploadBtn.addEventListener('click', async () => {
        if (!selectedFile) return;

        status.innerText = 'Uploading...';
        
        try {
          // Send file via Rust to backend API
          const serverResponse = await upload_image(selectedFile, 'https://httpbin.org/post');
          status.innerText = 'Upload successful!';
          console.log('Server response:', serverResponse);
        } catch (err) {
          status.innerText = 'Upload failed: ' + err;
          console.error(err);
        }
      });
    }

    run();
  </script>
</body>
</html>
