<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plant Sickness Detection</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .status-box {
      margin-top: 15px;
      padding: 10px;
      background: #f0f0f0;
      border-radius: 5px;
      font-family: monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Plant Sickness Detection</h2>

    <div class="action-buttons">
      <!-- Android Native Camera Input -->
      <label for="cameraInput" class="btn btn-secondary" id="cameraLabel">
        Take Picture / Choose File
      </label>
      <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
    </div>

    <button id="processBtn" class="btn btn-primary" style="display: none; margin-top: 10px;">Process Image</button>

    <div class="preview-container" style="margin-top: 10px;">
      <canvas id="canvasPreview" width="224" height="224" style="display:none;"></canvas>
    </div>

    <div id="status" class="status-box">Loading WASM module...</div>
  </div>

  <script type="module">
    import init, { process_image_full, init_panic_hook } from './pkg/plant_sickness.js';

    const statusEl = document.getElementById('status');
    
    function logScreen(msg, isError = false) {
      statusEl.innerText = msg;
      statusEl.style.color = isError ? 'red' : 'black';
    }

    // Catch JavaScript execution errors
    window.onerror = function(msg, url, line) {
      logScreen(`JS Error: ${msg} (Line ${line})`, true);
      return false;
    };

    async function run() {
      try {
        // EXPLICIT PATH: Required for GitHub Pages subfolders on Android
        await init('./pkg/plant_sickness_bg.wasm');
        
        if (typeof init_panic_hook === 'function') {
          init_panic_hook();
        }
        logScreen('WASM loaded! Take a picture or select an image.');
      } catch (err) {
        logScreen(`WASM Load Failed: ${err.message || err}`, true);
        return;
      }

      const cameraInput = document.getElementById('cameraInput');
      const processBtn = document.getElementById('processBtn');
      const canvas = document.getElementById('canvasPreview');
      const ctx = canvas.getContext('2d');

      let processableByteArray = null;

      // Downscale high-res Android photos before feeding into WebAssembly
      async function prepareAndroidPhoto(file) {
        logScreen('Downscaling image for Android WASM memory...');
        
        return new Promise((resolve, reject) => {
          const img = new Image();
          const objectUrl = URL.createObjectURL(file);

          img.onload = () => {
            URL.revokeObjectURL(objectUrl);

            // Cap max dimension at 800px to prevent OOM crash
            const maxDim = 800;
            let width = img.width;
            let height = img.height;

            if (width > maxDim || height > maxDim) {
              if (width > height) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              } else {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }
            }

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = width;
            tempCanvas.height = height;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(img, 0, 0, width, height);

            tempCanvas.toBlob(async (blob) => {
              if (!blob) {
                reject(new Error('Failed to create JPEG blob from image canvas'));
                return;
              }
              const buffer = await blob.arrayBuffer();
              resolve(new Uint8Array(buffer));
            }, 'image/jpeg', 0.85);
          };

          img.onerror = () => {
            URL.revokeObjectURL(objectUrl);
            reject(new Error('Failed to parse photo format.'));
          };

          img.src = objectUrl;
        });
      }

      cameraInput.addEventListener('change', async (e) => {
        if (e.target.files.length === 0) return;

        try {
          const file = e.target.files[0];
          processableByteArray = await prepareAndroidPhoto(file);
          
          processBtn.style.display = 'block';
          logScreen('Photo ready! Click "Process Image".');
        } catch (err) {
          logScreen(`Image load error: ${err.message}`, true);
        }
      });

      processBtn.addEventListener('click', () => {
        if (!processableByteArray) return;

        logScreen('Running Rust pipeline...');
        processBtn.disabled = true;

        // Brief delay allows the browser UI to update status text before WASM locks thread
        setTimeout(() => {
          try {
            const result = process_image_full(processableByteArray, null);

            const rgbaBytes = result.rgba_bytes;
            const clampedArray = new Uint8ClampedArray(
              rgbaBytes.buffer,
              rgbaBytes.byteOffset,
              rgbaBytes.byteLength
            );

            const imageData = new ImageData(clampedArray, 224, 224);
            ctx.putImageData(imageData, 0, 0);
            canvas.style.display = 'block';

            const normalizedTensor = result.normalized_tensor;
            logScreen(`Success! Output Tensor generated with size: ${normalizedTensor.length}`);
          } catch (err) {
            logScreen(`WASM Pipeline Error: ${err}`, true);
            console.error(err);
          } finally {
            processBtn.disabled = false;
          }
        }, 50);
      });
    }

    run();
  </script>
</body>
</html>
